name: CI

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:

jobs:
  check:
    name: Build, test, API snapshot, tarball smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before test: tests import the packages' dist output.
      - run: pnpm -r build
      - run: pnpm -r test
      - name: API snapshot (S1)
        run: pnpm api:check
      - name: Tarball smoke
        run: pnpm smoke
