name: Tutorial on GitHub Pages

# R4: builds the tutorial below /<repository>/ and deploys it to GitHub Pages.
# Off until Pages is set up: Settings → Pages → Source "GitHub Actions", and the
# repository variable PAGES_ENABLED = true (Settings → Secrets and variables →
# Actions → Variables). For a private repository Pages needs a paid plan, and the
# site is public.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm install --frozen-lockfile
      - name: Build the tutorial for Pages (base path + 404.html fallback)
        run: pnpm --filter tutorial build:pages
        env:
          TUTORIAL_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/tutorial/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
