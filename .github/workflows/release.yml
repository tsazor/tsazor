name: Release

# Publishes every package to npm (docs/design-release.md). Started by hand, like all of CI, and only in the public
# release repository with the repository variable RELEASE_ENABLED = true: until then the prereleases go to a local
# registry (D-P2).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'tsazor/tsazor' && vars.RELEASE_ENABLED == 'true'
    # Pinned like ci.yml's check job: the Ubuntu the release was tested on, not whatever ubuntu-latest becomes.
    runs-on: ubuntu-24.04
    # Npm's Trusted Publisher names this environment too; its protection rules can ask for an approval.
    environment: npm
    permissions:
      contents: read
      id-token: write # Trusted Publishing and provenance (OIDC)
      attestations: write # the SBOM's attestation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # its npm is 11.5.1 or later, which Trusted Publishing needs
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm api:check
      - run: pnpm smoke
      - run: pnpm rehearsal
      - name: Publish (dist-tag next for a prerelease, else latest) and write the SBOM
        run: node scripts/release.mjs publish --registry https://registry.npmjs.org/ --provenance
        env:
          # The first release only: a short-lived granular token (design-release.md, release day). Later releases go
          # through Trusted Publishing and need none.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Find the SBOM
        id: sbom
        run: echo "path=$(ls .release/tsazor-*.cdx.json)" >> "$GITHUB_OUTPUT"
      # Signs the SBOM for the tarballs (Sigstore, as npm's provenance): `gh attestation verify <tarball> --repo
      # tsazor/tsazor --predicate-type https://cyclonedx.org/bom` checks it, and the attestation keeps the SBOM.
      - uses: actions/attest-sbom@v2
        with:
          subject-path: .release/*.tgz
          sbom-path: ${{ steps.sbom.outputs.path }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.path }}
